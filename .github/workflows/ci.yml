name: CI

# The platform layer is selected by build tags, so compiling for one OS proves
# nothing about the others. These jobs run the tests on real runners to keep
# that honest, and the release job cross-compiles the binaries that ship.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 1.21 is the floor in go.mod, so test it rather than only the latest.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: injector/go.mod

      - name: check formatting
        # Windows runners default to PowerShell; this step is POSIX shell.
        shell: bash
        working-directory: injector
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: vet
        working-directory: injector
        run: go vet ./...

      - name: test
        working-directory: injector
        run: go test -count=1 -race ./...

      - name: build
        id: build
        shell: bash
        working-directory: injector
        run: |
          # An explicit -o name is used verbatim, so the .exe has to be part of
          # it or the smoke test below would look for a file that does not exist.
          if [ "$RUNNER_OS" = "Windows" ]; then
            out="$RUNNER_TEMP/injector.exe"
          else
            out="$RUNNER_TEMP/injector"
          fi
          go build -trimpath -ldflags "-s -w" -o "$out" .
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: smoke test the built binary
        shell: bash
        run: |
          "${{ steps.build.outputs.out }}" --help
          "${{ steps.build.outputs.out }}" --status --path "$(pwd)/sandbox/fake-install" || true

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: injector/go.mod

      # A GOOS-only vet does not typecheck build-tagged code, so each target is
      # built for real rather than merely vetted.
      - name: build every supported target
        shell: bash
        working-directory: injector
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "==> $target"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/$os-$arch" .
            # These are foreign binaries: confirm they were produced and are
            # non-empty, but do not try to run them here.
            test -s "$RUNNER_TEMP/$os-$arch"
          done

      - name: check the theme engine parses
        run: node --check injector/assets/theme-engine.js

  release:
    name: release
    needs: [test, cross-compile]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: injector/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: build the release binaries
        run: ./build.sh --all

      - name: publish
        if: ${{ !github.event.repository.fork }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The workflow fires on the tag push, which is before the release
          # exists, so create it rather than assuming it is already there.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          echo "published $TAG"